name: Native webcam spike

on:
  pull_request:
    paths:
      - 'native/webcam-ios/**'
      - '.github/workflows/native-webcam-spike.yml'
  push:
    branches:
      - 'experiment/native-webcam-4k60'
    paths:
      - 'native/webcam-ios/**'
      - '.github/workflows/native-webcam-spike.yml'

jobs:
  swift-package-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build native capture package
        working-directory: native/webcam-ios
        run: swift build