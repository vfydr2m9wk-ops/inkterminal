name: InkDOSHubWebcamTest
options:
  bundleIdPrefix: io.inkdoshub
  deploymentTarget:
    iOS: "16.0"
targets:
  InkDOSHubWebcamTest:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Info.plist
      - path: ../Native4K60Capture.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.inkdoshub.webcamtest
        PRODUCT_NAME: InkDOSHubWebcamTest
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
